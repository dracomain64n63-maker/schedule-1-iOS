
name: Build Schedule 1 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Schedule 1
        run: |
          xcodebuild \
            -project Schedule1.xcodeproj \
            -scheme Schedule1 \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/Schedule1.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" Schedule1-iOS-Simulator.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Schedule1-iOS-Simulator
          path: Schedule1-iOS-Simulator.zip
          if-no-files-found: error
