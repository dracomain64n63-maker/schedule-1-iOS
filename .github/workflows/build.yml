
name: Build Schedule 1 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -e

          xcodebuild \
            -project Schedule1.xcodeproj \
            -scheme Schedule1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Fix and verify app metadata
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Schedule1.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"
          test -f "$APP_PATH/Schedule1"

          set_or_add() {
            local key="$1"
            local value="$2"

            if /usr/libexec/PlistBuddy -c "Set :$key $value" "$PLIST" 2>/dev/null; then
              echo "Updated $key"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$PLIST"
              echo "Added $key"
            fi
          }

          set_or_add CFBundleIdentifier com.example.schedule1
          set_or_add CFBundleExecutable Schedule1
          set_or_add CFBundlePackageType APPL
          set_or_add CFBundleVersion 1
          set_or_add CFBundleShortVersionString 1.0
          set_or_add CFBundleName Schedule1
          set_or_add CFBundleDisplayName "Schedule 1"

          echo "Verifying app metadata..."

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Schedule1.app"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build

          zip -qry Schedule1-unsigned.ipa Payload
          unzip -t Schedule1-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Schedule1-Unsigned-IPA
          path: build/Schedule1-unsigned.ipa
          if-no-files-found: error
