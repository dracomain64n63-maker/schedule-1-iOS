
name: Build Schedule 1 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Schedule1.xcodeproj \
            -scheme Schedule1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Schedule1.app"

          test -d "$APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -r Schedule1-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Schedule1-Unsigned-IPA
          path: build/Schedule1-unsigned.ipa
          if-no-files-found: error
