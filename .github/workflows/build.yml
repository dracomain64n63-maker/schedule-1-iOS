name: Build Schedule 1 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unreal Engine
        run: |
          if [ ! -f "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" ]; then
            echo "Unreal Engine was not found."
            exit 1
          fi

      - name: Build and package iOS
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/Schedule1.uproject" \
            -platform=IOS \
            -clientconfig=Shipping \
            -build \
            -cook \
            -stage \
            -pak \
            -package \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/BuildOutput"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Schedule1-iOS-Build
          path: BuildOutput/
          if-no-files-found: error
